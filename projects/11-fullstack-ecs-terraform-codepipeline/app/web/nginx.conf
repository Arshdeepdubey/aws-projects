server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check for the ALB target group. Must not depend on the API.
  location = /health {
    access_log off;
    add_header Content-Type application/json;
    return 200 '{"status":"ok"}';
  }

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # leaves browsers pointing at asset files that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # SPA routing: unknown paths serve the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
