# Reference AppSpec for the blue/green deployment.
#
# scripts/deploy.sh generates this at deploy time with the freshly registered
# task definition ARN, so you normally do not edit this file — it is here to
# show the shape, and for the lifecycle hooks.
version: 0.0

Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: "arn:aws:ecs:REGION:ACCOUNT:task-definition/fargate-web-dev:REVISION"
        LoadBalancerInfo:
          ContainerName: "app"
          ContainerPort: 8080
        # Optional: override networking per deployment
        # NetworkConfiguration:
        #   AwsvpcConfiguration:
        #     Subnets: ["subnet-aaa", "subnet-bbb"]
        #     SecurityGroups: ["sg-ccc"]
        #     AssignPublicIp: "DISABLED"

# Lambda hooks run at each stage. AfterAllowTestTraffic is the valuable one:
# point it at a smoke-test Lambda that hits the test listener and fails the
# deployment before any production traffic reaches the new fleet.
# Hooks:
#   - BeforeInstall: "arn:aws:lambda:REGION:ACCOUNT:function:before-install"
#   - AfterInstall: "arn:aws:lambda:REGION:ACCOUNT:function:after-install"
#   - AfterAllowTestTraffic: "arn:aws:lambda:REGION:ACCOUNT:function:smoke-tests"
#   - BeforeAllowTraffic: "arn:aws:lambda:REGION:ACCOUNT:function:before-allow-traffic"
#   - AfterAllowTraffic: "arn:aws:lambda:REGION:ACCOUNT:function:after-allow-traffic"
